<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas Server Console</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --fg:#e6edf3; --dim:#8b949e; --acc:#58a6ff; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:var(--bg); color:var(--fg); font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  body { display:flex; flex-direction:column; }
  nav { display:flex; align-items:center; gap:2px; background:var(--panel); border-bottom:1px solid var(--line); padding:0 8px; }
  nav .brand { color:var(--dim); font-size:12px; letter-spacing:.08em; text-transform:uppercase; margin-right:14px; padding:10px 4px; }
  nav button { background:none; border:none; color:var(--dim); font:inherit; padding:10px 14px; cursor:pointer; border-bottom:2px solid transparent; }
  nav button:hover { color:var(--fg); }
  nav button.on { color:var(--fg); border-bottom-color:var(--acc); }
  main { flex:1; position:relative; }
  iframe { position:absolute; inset:0; width:100%; height:100%; border:0; display:none; background:var(--bg); }
  iframe.on { display:block; }
</style>
</head>
<body>
<nav>
  <span class="brand">atlas server</span>
  <button data-t="shell" class="on">Terminal</button>
  <button data-t="docker">Docker</button>
  <button data-t="db">Database</button>
  <button data-t="git">Git</button>
</nav>
<main>
  <iframe id="shell" class="on" src="/shell/"></iframe>
  <iframe id="docker"></iframe>
  <!-- pgsql param prefills driver+server; adding username= would make adminer
       attempt a passwordless login and 403 -->
  <iframe id="db" data-src="/db/?pgsql=postgres"></iframe>
  <!-- trailing slash matters: the board's fetches are relative to /git/ -->
  <iframe id="git" data-src="/git/"></iframe>
</main>
<script>
  // Portainer cannot live under a subpath; :9001 is caddy stripping its
  // frame-ancestors CSP so the iframe is allowed. Direct :9000 is loopback-only.
  // Via the Cloudflare tunnel (console.<domain>) there is no :9001 — portainer
  // rides its own tunnel hostname on the same domain instead.
  var h = location.hostname;
  document.getElementById("docker").dataset.src = /^[\d.]+$/.test(h)
    ? "http://" + h + ":9001/"
    : "https://portainer." + h.split(".").slice(1).join(".") + "/";
  const tabs = document.querySelectorAll("nav button"), frames = document.querySelectorAll("iframe");
  tabs.forEach(b => b.addEventListener("click", () => {
    tabs.forEach(x => x.classList.toggle("on", x === b));
    frames.forEach(f => {
      const on = f.id === b.dataset.t;
      if (on && !f.src && f.dataset.src) f.src = f.dataset.src; // lazy-load on first visit
      f.classList.toggle("on", on);
      if (on) f.contentWindow && f.contentWindow.focus();
    });
  }));
</script>
</body>
</html>
