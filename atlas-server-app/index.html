<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas Server Console</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --fg:#e6edf3; --dim:#8b949e; --acc:#58a6ff; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:var(--bg); color:var(--fg); font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  body { display:flex; flex-direction:column; }
  nav { display:flex; align-items:center; gap:2px; background:var(--panel); border-bottom:1px solid var(--line); padding:0 8px; }
  nav .brand { color:var(--dim); font-size:12px; letter-spacing:.08em; text-transform:uppercase; margin-right:14px; padding:10px 4px; }
  nav button { background:none; border:none; color:var(--dim); font:inherit; padding:10px 14px; cursor:pointer; border-bottom:2px solid transparent; }
  nav button:hover { color:var(--fg); }
  nav button.on { color:var(--fg); border-bottom-color:var(--acc); }
  main { flex:1; position:relative; }
  iframe { position:absolute; inset:0; width:100%; height:100%; border:0; display:none; background:var(--bg); }
  iframe.on { display:block; }
</style>
</head>
<body>
<nav>
  <span class="brand">atlas server</span>
  <button data-t="shell" class="on">Terminal</button>
  <button data-t="docker">Docker</button>
  <button data-t="db">Database</button>
  <button data-t="git">Git</button>
</nav>
<main>
  <iframe id="shell" class="on" src="/shell/" data-loaded="1"></iframe>
  <!-- same origin now: portainer is mounted at /docker/ rather than on its own
       port and tunnel hostname, so there is one way in and one login -->
  <iframe id="docker" data-src="/docker/"></iframe>
  <iframe id="db" name="db"></iframe>
  <!-- Adminer only attempts a connection once a password has been submitted
       (it guards on is_string(get_password())), so the tab posts this form on
       first open. The password below is a placeholder and is NOT a credential:
       the atlas-autologin plugin's login() accepts anything and its
       credentials() supplies the real host/user/password from the server's
       environment, so this value never reaches postgres. -->
  <form id="dbauth" method="post" action="/db/" target="db" hidden>
    <input type="hidden" name="auth[driver]" value="pgsql">
    <input type="hidden" name="auth[server]" value="postgres">
    <input type="hidden" name="auth[username]" value="postgres">
    <input type="hidden" name="auth[password]" value="placeholder-not-a-credential">
  </form>
  <!-- trailing slash matters: the board's fetches are relative to /git/ -->
  <iframe id="git" data-src="/git/"></iframe>
</main>
<script>
  const tabs = document.querySelectorAll("nav button"), frames = document.querySelectorAll("iframe");
  tabs.forEach(b => b.addEventListener("click", () => {
    tabs.forEach(x => x.classList.toggle("on", x === b));
    frames.forEach(f => {
      const on = f.id === b.dataset.t;
      // lazy-load on first visit only — the db tab logs itself in with a POST,
      // and re-posting on every tab switch would throw away where you were
      if (on && !f.dataset.loaded) {
        f.dataset.loaded = "1";
        if (f.id === "db") document.getElementById("dbauth").submit();
        else if (f.dataset.src) f.src = f.dataset.src;
      }
      f.classList.toggle("on", on);
      if (on) f.contentWindow && f.contentWindow.focus();
    });
  }));
</script>
</body>
</html>
