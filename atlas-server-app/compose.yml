services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5
  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      # Feeds the auto-login plugin so the Database tab does not ask for the
      # Postgres password behind two layers of auth that already identified you.
      ATLAS_DB_HOST: ${ATLAS_DB_HOST:-postgres}
      ATLAS_DB_USER: ${ATLAS_DB_USER:-postgres}
      ATLAS_DB_PASS: ${POSTGRES_PASSWORD}
    volumes:
      - ./adminer-plugins/atlas-autologin.php:/var/www/html/plugins-enabled/atlas-autologin.php:ro
  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./app:/srv:ro
volumes:
  pgdata:
  portainer_data:
